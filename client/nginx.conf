server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Silences a startup warning and keeps large hobby lists from being refused.
    client_max_body_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # The API is proxied rather than called cross-origin, which is what lets the
    # server run with no CORS configuration at all. The client asks the same
    # origin it was served from, exactly as it does behind Vite in development.
    location /api/ {
        proxy_pass         http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite fingerprints these filenames, so a change produces a new URL and the
    # old one can be cached indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading the previous
    # deployment's asset URLs after a release.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page application: unknown paths are routes, not missing files, so
    # they fall through to the app rather than returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
