<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse, search and filter a directory of people." />
    <title>User Directory</title>
    <script>
      /*
       * Resolve the theme before first paint.
       *
       * Deliberately blocking and inlined: if this ran after hydration, a
       * dark-mode user would see a white flash on every load. It duplicates a
       * few lines of src/lib/theme.ts, which is the accepted cost of running
       * before any module has loaded.
       */
      (function () {
        try {
          var stored = localStorage.getItem('presight-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
